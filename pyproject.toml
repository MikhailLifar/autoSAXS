[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosaxs"
version = "3.1.0"
description = "Interactive SAXS pipeline core: calibration, integration, subtraction, ATSAS descriptors, plots, shape fitting, reports. After install, run `autosaxs doctor` (health check) and `autosaxs --help` (epilog lists get-docs, get-skills, get-default-config)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Mikhail S. Lifar", email = "mikhailkulkov11@gmail.com" },
]
keywords = ["saxs", "small-angle scattering", "pyFAI", "ATSAS", "calibration", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ase>=3.22,<4",
    "denss>=1.8.0,<2",
    "fabio>=2023.1,<2027",
    "matplotlib>=3.7,<3.12",
    "mcsas3>=1.0.6,<2",
    "numpy>=2.0,<2.4",
    "pandas>=2.0,<3.1",
    "pyFAI>=2024.1,<2027",
    "PyYAML>=6.0,<7",
    "reportlab>=4.0,<6",
    "scikit-image>=0.22,<0.27",
    "scikit-learn>=1.3,<1.10",
    "scipy>=1.11,<1.19",
    "seaborn>=0.12,<0.15",
]

[project.urls]
Homepage = "https://github.com/MikhailLifar/autoSAXS"
Repository = "https://github.com/MikhailLifar/autoSAXS"
Issues = "https://github.com/MikhailLifar/autoSAXS/issues"
Documentation = "https://github.com/MikhailLifar/autoSAXS#readme"

[project.scripts]
autosaxs = "autosaxs.cli:main"
guisaxs-skills = "guisaxs_skills.__main__:main"
guisaxs-liveview = "guisaxs_liveview.__main__:main"

[project.optional-dependencies]
dev = ["build", "import-linter", "pip", "twine"]
gui = ["PyQt5>=5.15,<6", "watchdog>=4,<7"]
llm = ["httpx", "openai", "requests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["autosaxs*", "guisaxs_skills*", "guisaxs_liveview*"]

[tool.setuptools.package-data]
autosaxs = [
    "resources/agent_quickstart.txt",
    "resources/ai_skills/*.md",
    "resources/config_base.conf",
    "resources/help/guisaxs_liveview/**/*",
    "resources/prompts/**/*.txt",
    "resources/readme/*.md",
    "resources/readme/images/**/*",
    "resources/schemas/*.json",
]
